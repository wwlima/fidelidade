spring:
  application:
    name: fidelidade-desktop
  main:
    web-application-type: none
    headless: false
  datasource:
    url: jdbc:h2:file:./data/fidelidade;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: SA
    password: SA
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:25}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}

fidelidade:
  notificacao:
    destinatario: ${NOTIFICACAO_EMAIL:}
